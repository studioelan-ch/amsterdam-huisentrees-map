<head>

<title>Amsterdamse Huisentrees – studio elan</title>

<style>
:root { color-scheme:light; --ink:#121212; --paper:#fff; --hair:#dedede; --mute:#747474; }
* { box-sizing:border-box; }
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Arial,Helvetica,sans-serif;}
#map {position:absolute;inset:0;background:white;}
#loading {position:absolute;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none;background:white;color:#777;font-size:12px;letter-spacing:.04em;transition:opacity .4s ease;}
#loading.hidden {opacity:0;}
#error {display:none;position:absolute;inset:0;z-index:6;place-items:center;background:#fff;padding:24px;text-align:center;color:#555;font-size:14px;line-height:1.6;}
#error.visible {display:grid;}
#error strong {display:block;color:#111;font-size:17px;margin-bottom:8px;font-weight:500;}
.maplibregl-ctrl-top-right {top:18px;right:18px;}
.maplibregl-ctrl-group {box-shadow:none!important;border:1px solid #ddd!important;border-radius:0!important;background:#fff!important;}
.maplibregl-ctrl-group button {width:36px!important;height:36px!important;}
.maplibregl-ctrl-group button+button {border-top:1px solid #e6e6e6!important;}
.maplibregl-ctrl button .maplibregl-ctrl-icon {filter:grayscale(1);}
.maplibregl-ctrl-attrib {background:rgba(255,255,255,.88)!important;font:10px Arial,Helvetica,sans-serif!important;color:#666!important;}
.maplibregl-ctrl-attrib a {color:#666!important;}

/* Discreet type selector; all controls remain outside the MapLibre canvas. */
.type-filter {position:absolute;z-index:4;top:18px;left:18px;max-width:min(680px,calc(100vw - 102px));border:1px solid #dedede;background:rgba(255,255,255,.97);padding:9px 9px 8px;box-shadow:0 1px 5px rgba(0,0,0,.035);}
.type-filter-heading {font-size:9px;line-height:1.2;color:#777;text-transform:uppercase;letter-spacing:.1em;margin:0 0 7px 3px;}
.type-filter-row {display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.type-filter-row button {appearance:none;flex:0 0 auto;min-width:32px;min-height:31px;border:1px solid transparent;background:transparent;color:#111;font:12px Arial,Helvetica,sans-serif;padding:5px 9px;cursor:pointer;border-radius:0;}
.type-filter-row button:hover:not([aria-pressed="true"]) {border-color:#dcdcdc;background:#f5f5f5;}
.type-filter-row button[aria-pressed="true"] {background:#111;color:#fff;border-color:#111;}
.type-filter-row button:focus-visible {outline:2px solid #111;outline-offset:2px;}
.sr-only {position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.book-legend {display:none;position:absolute;z-index:3;bottom:86px;left:24px;background:rgba(255,255,255,.97);border:1px solid #dedede;padding:9px 12px;gap:10px;align-items:center;font-size:11px;color:#555;}
.book-legend.visible {display:flex;}
.book-legend-symbol {position:relative;display:inline-block;flex:0 0 22px;height:22px;}
.book-legend-symbol::before {content:"";position:absolute;left:8px;top:8px;background:#111;border-radius:50%;width:6px;height:6px;}
.book-legend-symbol::after {content:"";position:absolute;left:3px;top:3px;border:1px solid #111;border-radius:50%;width:16px;height:16px;}
.maplibregl-canvas {cursor:grab;}
.maplibregl-canvas:active {cursor:grabbing;}
#reset {position:absolute;z-index:3;bottom:32px;left:24px;appearance:none;border:1px solid #d7d7d7;background:rgba(255,255,255,.96);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;}
#reset svg {width:17px;height:17px;stroke:#111;fill:none;stroke-width:1.7;}
#reset:hover {background:#f2f2f2;}
/* Viewport-anchored info card: position is calculated ONCE when opened.
   It does not move with the map camera. On narrow screens the filter stays in front. */
.elan-floating-popup {position:fixed;left:0;top:0;z-index:5;visibility:hidden;max-width:calc(100vw - 24px);pointer-events:auto;}
.elan-floating-popup .maplibregl-popup-content {max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;}
.type-filter {z-index:8;}

.elan-popup .maplibregl-popup-content {padding:0;border:1px solid var(--hair);border-radius:0;background:var(--paper);box-shadow:0 8px 32px rgba(0,0,0,.13);overflow:hidden;width:300px;max-width:calc(100vw - 30px);}
.elan-popup .maplibregl-popup-tip {border-top-color:white;border-bottom-color:white;}
.elan-card {width:100%;background:#fff;color:var(--ink);}
.elan-image-area {display:grid;place-items:center;position:relative;background:#f1f1f1;min-height:166px;max-height:min(340px,45vh);overflow:hidden;}
.elan-image-area[data-state="loaded"] {min-height:0;}
.elan-image-area img {display:block;width:100%;max-height:min(340px,45vh);height:auto;object-fit:contain;}
.elan-image-area[data-state="loading"] img, .elan-image-area[data-state="error"] img {display:none;}
.elan-image-area[data-state="error"] {min-height:110px;}
.elan-image-placeholder {display:none;align-items:center;justify-content:center;position:absolute;inset:0;}
.elan-image-area[data-state="loading"] .elan-image-placeholder,.elan-image-area[data-state="error"] .elan-image-placeholder {display:flex;}
.elan-image-placeholder svg {width:20px;height:20px;stroke:#aaa;stroke-width:1.2;fill:none;}
.elan-meta {padding:16px 17px 14px;position:relative;}
.elan-address {font-size:19px;font-weight:500;line-height:1.22;margin:0 29px 7px 0;overflow-wrap:anywhere;letter-spacing:-.025em;}
.elan-type {margin:0;font-size:12px;line-height:1.45;color:#666;font-weight:400;}
.elan-close {position:absolute;top:10px;right:10px;border:0;background:transparent;color:#111;padding:0;width:25px;height:25px;display:grid;place-items:center;cursor:pointer;}
.elan-close svg {width:16px;height:16px;stroke:currentColor;stroke-width:1.65;fill:none;}
.elan-close:hover {background:#f3f3f3;}
.elan-bottom {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px;min-height:18px;}
.elan-credit {display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.35;color:#666;margin:0;text-decoration:none;white-space:nowrap;}
.elan-copy-mark {font-size:15px;line-height:1;font-weight:400;color:#333;}
.elan-credit:hover {color:#111;text-decoration:underline;text-underline-offset:2px;}
.elan-credit:focus-visible {outline:2px solid #111;outline-offset:3px;}
.elan-group {display:none;align-items:center;gap:7px;flex-shrink:0;}
.elan-group[data-visible="true"] {display:flex;}
.elan-group button {width:25px;height:25px;display:grid;place-items:center;background:#fff;border:1px solid #e1e1e1;cursor:pointer;}
.elan-group button:hover {background:#f4f4f4;}
.elan-group svg {width:12px;height:12px;fill:none;stroke:#222;stroke-width:1.6;}
.elan-group span {font-size:10px;color:#777;font-variant-numeric:tabular-nums;}
@media(max-width:640px){
  .type-filter {top:12px;left:12px;max-width:calc(100vw - 96px);padding:7px;}
  .type-filter-row button {padding:5px 9px;min-width:34px;min-height:33px;}
  .book-legend {left:12px;bottom:66px;}

  #reset {left:12px;bottom:12px;}
  .maplibregl-ctrl-top-right {top:12px;right:12px;}
  .elan-popup .maplibregl-popup-content {width:min(280px,calc(100vw - 28px));}
  .elan-address {font-size:17px;}
  .elan-image-area {max-height:35vh;}
  .elan-image-area img {max-height:35vh;}
}
@media(prefers-reduced-motion:reduce){#loading{transition:none;}}
</style>
</head>

 sources:{'openfreemap':{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'<a href="https://openfreemap.org/">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}},
 layers:[
  {id:'background',type:'background',paint:{'background-color':'#ffffff'}},
  {id:'water',type:'fill',source:'openfreemap','source-layer':'water',paint:{'fill-color':'#c7c7c7','fill-opacity':1}},
  {id:'waterway',type:'line',source:'openfreemap','source-layer':'waterway',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#c7c7c7','line-width':['interpolate',['linear'],['zoom'],11,1,15,2.5,18,5]}},
  {id:'roads',type:'line',source:'openfreemap','source-layer':'transportation',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ececec','line-width':['interpolate',['linear'],['zoom'],11,.5,14,1.2,17,3,20,8]}},
  {id:'buildings',type:'fill',source:'openfreemap','source-layer':'building',minzoom:12.2,paint:{'fill-color':'#e5e5e5','fill-opacity':1}},
  {id:'building-outlines',type:'line',source:'openfreemap','source-layer':'building',minzoom:15,paint:{'line-color':'#dadada','line-width':.4}}
 ]
};
const bounds=new maplibregl.LngLatBounds();
for(const f of geojson.features) bounds.extend(f.geometry.coordinates);
const byId=new Map(geojson.features.map(f=>[Number(f.id),f]));
const byCoord=new Map();
for(const f of geojson.features){
 const k=f.geometry.coordinates.join(',');
 if(!byCoord.has(k))byCoord.set(k,[]);
 byCoord.get(k).push(f);
}
const loading=document.getElementById('loading');
let map,popup=null,currentId=null,hoverId=null,activeGroup=[],groupIndex=0,loaded=false;
try {
 map=new maplibregl.Map({container:'map',style:mapStyle,center:[4.897,52.366],zoom:12,minZoom:10.5,maxZoom:20,pitch:0,bearing:0,attributionControl:true,scrollZoom:false,dragRotate:false,touchPitch:false,antialias:true});
}catch(e){fail(e);}
if(map){
 map.addControl(new maplibregl.NavigationControl({showCompass:false,visualizePitch:false}),'top-right');
 map.once('load',()=>{
   loaded=true;
   map.addSource('entrances',{type:'geojson',data:geojson,promoteId:'id'});
   map.addLayer({id:'marker-halo',type:'circle',source:'entrances',paint:{
     'circle-radius':['case',['boolean',['feature-state','selected'],false],11,['boolean',['feature-state','hover'],false],9,0],
     'circle-color':'#ffffff','circle-stroke-color':'#111111',
     'circle-stroke-width':['case',['boolean',['feature-state','selected'],false],1.4,['boolean',['feature-state','hover'],false],1,0],
     'circle-opacity':['case',['any',['boolean',['feature-state','selected'],false],['boolean',['feature-state','hover'],false]],1,0]
   }});
   // Book selection is taken from the book PDF and is independent of typology.
   map.addLayer({id:'book-selection-ring',type:'circle',source:'entrances',
     filter:['==',['get','book_selection'],true],
     paint:{'circle-radius':['interpolate',['linear'],['zoom'],10.5,3.15,11.5,3.55,12.5,4.35,13.5,5.55,15,7.8,18,12],
       'circle-color':'#ffffff','circle-opacity':0,
       'circle-stroke-color':'#111111',
       'circle-stroke-width':['interpolate',['linear'],['zoom'],10.5,.8,13,1,17,1.1],
       'circle-stroke-opacity':1}});
   map.addLayer({id:'markers',type:'circle',source:'entrances',paint:{
     'circle-color':'#111111',
     'circle-radius':['interpolate',['linear'],['zoom'],11,2,13,3,15,4.5,18,6.5],
     'circle-stroke-color':'#ffffff','circle-stroke-width':1.1
   }});
   map.addLayer({id:'marker-hitareas',type:'circle',source:'entrances',paint:{
     'circle-color':'#111111','circle-radius':['interpolate',['linear'],['zoom'],11,10,14,12,18,15],
     'circle-opacity':.001,'circle-stroke-width':0
   }});
   applyTypeFilter(activeType);
   fitAll(false);
   loading.classList.add('hidden');
   setTimeout(()=>loading.remove(),600);
 });
 map.on('error',e=>console.warn('MapLibre / Tile error:',e.error||e));
 map.on('mousemove','marker-hitareas',e=>{
   map.getCanvas().style.cursor='pointer';
   const next=e.features?.[0]?.id;
   if(hoverId===next)return;
   if(hoverId!==null&&hoverId!==undefined)map.setFeatureState({source:'entrances',id:hoverId},{hover:false});
   hoverId=next;
   if(hoverId!==null&&hoverId!==undefined)map.setFeatureState({source:'entrances',id:hoverId},{hover:true});
 });
 map.on('mouseleave','marker-hitareas',()=>{
   map.getCanvas().style.cursor='grab';
   if(hoverId!==null&&hoverId!==undefined)map.setFeatureState({source:'entrances',id:hoverId},{hover:false});
   hoverId=null;
 });
 map.on('click','marker-hitareas',e=>{
   const rendered=e.features?.[0];
   const id=Number(rendered?.properties?.id??rendered?.id);
   const original=byId.get(id);
   if(!original)return;
   const key=original.geometry.coordinates.join(',');
   const group=(byCoord.get(key)||[original]).filter(f=>activeType==='all'||f.properties.type===activeType);
   groupIndex=(activeGroup.length&&activeGroup[0].geometry.coordinates.join(',')===key)?(groupIndex+1)%group.length:0;
   activeGroup=group;
   selectFeature(group[groupIndex]);
 });
 map.on('click',e=>{
   if(!map.queryRenderedFeatures(e.point,{layers:['marker-hitareas']}).length)closePopup();
 });
}
function applyTypeFilter(next){
 if(next!=='all'&&!typeOptions.includes(next))return;
 activeType=next;
 for(const btn of document.querySelectorAll('#type-filter [data-type]')){
   btn.setAttribute('aria-pressed',String(btn.dataset.type===next));
 }
 const visible=geojson.features.filter(f=>next==='all'||f.properties.type===next).length;
 document.getElementById('type-filter-announcement').textContent=`${next==='all'?'Alle Typologien':next}: ${visible} Eingänge sichtbar`;
 if(!loaded||!map)return;
 const typeFilter=next==='all'?null:['==',['get','type'],next];
 for(const layer of ['marker-halo','markers','marker-hitareas'])map.setFilter(layer,typeFilter);
 const bookCondition=['==',['get','book_selection'],true];
 map.setFilter('book-selection-ring',typeFilter?['all',bookCondition,typeFilter]:bookCondition);
 // A popup must not remain visible for an entrance excluded by the current filter.
 if(currentId!==null){
   const current=byId.get(currentId);
   if(current&&next!=='all'&&current.properties.type!==next)closePopup();
 }
 if(hoverId!==null&&hoverId!==undefined){
   map.setFeatureState({source:'entrances',id:hoverId},{hover:false});hoverId=null;
 }
}
for(const btn of document.querySelectorAll('#type-filter [data-type]')){
 btn.addEventListener('click',()=>applyTypeFilter(btn.dataset.type));
}
if(geojson.features.some(f=>f.properties.book_selection===true)){
 document.getElementById('book-legend').classList.add('visible');
}
function fitAll(animated){
 if(!map)return;
 map.fitBounds(bounds,{padding:{top:55,bottom:55,left:55,right:55},maxZoom:13.6,duration:animated?650:0});
}
function makeIcon(name){
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',name==='close'?'M5 5l14 14M19 5 5 19':name==='prev'?'M15 5l-7 7 7 7':'M9 5l7 7-7 7');
 svg.appendChild(p);return svg;
}
function buildPopupContent(feature){
 const props=feature.properties;
 const card=document.createElement('div');card.className='elan-card';
 const area=document.createElement('div');area.className='elan-image-area';area.dataset.state='loading';
 const placeholder=document.createElement('div');placeholder.className='elan-image-placeholder';placeholder.setAttribute('aria-hidden','true');
 placeholder.innerHTML='<svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx=".5"/><path d="M4 18l6-6 4 4 3-3 3 4"/><circle cx="16.5" cy="8.5" r="1.5"/></svg>';
 const img=document.createElement('img');img.alt=`Hauseingang ${props.name||''}`;img.decoding='async';
 // Prefer a future locally hosted file if present. Google My Maps links may be blocked outside Google.
 const image=props.local_image||props.image;
 img.onload=()=>{area.dataset.state='loaded';};
 img.onerror=()=>{area.dataset.state='error';};
 area.append(placeholder,img);
 if(typeof image==='string'&&(image.startsWith('https://')||image.startsWith('./')||image.startsWith('photos/'))){img.src=image;} else area.dataset.state='error';
 const meta=document.createElement('div');meta.className='elan-meta';
 const close=document.createElement('button');close.type='button';close.className='elan-close';close.setAttribute('aria-label','Schliessen');close.append(makeIcon('close'));
 close.addEventListener('click',ev=>{ev.stopPropagation();closePopup();});
 const address=document.createElement('h2');address.className='elan-address';address.textContent=props.name||'–';
 const type=document.createElement('p');type.className='elan-type';type.textContent=props.type||'–';
 const bottom=document.createElement('div');bottom.className='elan-bottom';
 const credit=document.createElement('a');credit.className='elan-credit';credit.href='https://studioelan.ch/';credit.target='_blank';credit.rel='noopener noreferrer';credit.setAttribute('aria-label','© studio elan – Website öffnen');const copyMark=document.createElement('span');copyMark.className='elan-copy-mark';copyMark.textContent='©';credit.append(copyMark,document.createTextNode('studio elan'));
 const group=document.createElement('div');group.className='elan-group';group.dataset.visible=String(activeGroup.length>1);
 const prev=document.createElement('button');prev.type='button';prev.setAttribute('aria-label','Vorheriger Eingang');prev.append(makeIcon('prev'));
 const count=document.createElement('span');count.textContent=`${groupIndex+1} / ${activeGroup.length}`;
 const next=document.createElement('button');next.type='button';next.setAttribute('aria-label','Nächster Eingang');next.append(makeIcon('next'));
 prev.addEventListener('click',ev=>{ev.stopPropagation();stepGroup(-1);});
 next.addEventListener('click',ev=>{ev.stopPropagation();stepGroup(1);});
 group.append(prev,count,next);bottom.append(credit,group);
 meta.append(close,address,type,bottom);card.append(area,meta);
 return card;
}
// Place the whole information card inside the visible map, not just its marker.
// IMPORTANT: no map.panBy, easeTo, or MapLibre Popup anchoring is used here.
// Once visible the card stays at its screen position even while the map moves.
let popupGeneration=0;
const cardMargin=12;

function limit(value,min,max){return Math.max(min,Math.min(value,max));}

function positionInitialCard(card,feature){
 const viewport=map.getContainer().getBoundingClientRect();
 const size=card.getBoundingClientRect();
 const point=map.project(feature.geometry.coordinates);
 const markerX=viewport.left+point.x, markerY=viewport.top+point.y;
 const width=size.width, height=size.height;
 const left=limit(markerX-width/2,viewport.left+cardMargin,viewport.right-cardMargin-width);
 const filter=document.getElementById('type-filter').getBoundingClientRect();
 // When sufficient space exists, keep the entire card BELOW the filter.
 const belowFilter=Math.max(viewport.top+cardMargin,filter.bottom+8);
 let topMin=viewport.top+cardMargin;
 if(belowFilter+height<=viewport.bottom-cardMargin)topMin=belowFilter;
 const topMax=Math.max(topMin,viewport.bottom-cardMargin-height);
 const gap=17;
 const above=markerY-height-gap, below=markerY+gap;
 let top;
 if(above>=topMin&&above<=topMax)top=above;
 else if(below>=topMin&&below<=topMax)top=below;
 else {
   // For points near the edges, position the CARD within the screen.
   // Never recenter the coordinate point or pan the map itself.
   top=limit(markerY-height/2,topMin,topMax);
 }
 card.style.left=`${Math.round(left)}px`;
 card.style.top=`${Math.round(top)}px`;
 card.style.visibility='visible';
}

function keepCardVisibleOnResize(card){
 // Only viewport resizing/orientation changes may move an open card. Panning
 // and zooming intentionally do NOT update its screen position.
 if(!card||!card.isConnected)return;
 const v=map.getContainer().getBoundingClientRect();
 const rect=card.getBoundingClientRect();
 card.style.left=`${Math.round(limit(rect.left,v.left+cardMargin,v.right-cardMargin-rect.width))}px`;
 card.style.top=`${Math.round(limit(rect.top,v.top+cardMargin,v.bottom-cardMargin-rect.height))}px`;
}

function selectFeature(feature){
 if(!feature||!map)return;
 const generation=++popupGeneration;
 if(popup){popup.remove();popup=null;}
 if(currentId!==null&&map.getSource('entrances'))map.setFeatureState({source:'entrances',id:currentId},{selected:false});
 currentId=Number(feature.id);
 map.setFeatureState({source:'entrances',id:currentId},{selected:true});
 const node=buildPopupContent(feature);
 const card=document.createElement('div');
 card.className='elan-popup elan-floating-popup';
 card.setAttribute('role','dialog');
 card.setAttribute('aria-modal','false');
 card.setAttribute('aria-label',`Hauseingang ${feature.properties.name||''}`);
 const shell=document.createElement('div');
 shell.className='maplibregl-popup-content';
 shell.append(node);card.append(shell);
 document.body.append(card);
 popup=card;
 let shown=false;
 const show=()=>{
   if(shown||popup!==card||generation!==popupGeneration)return;
   shown=true;
   requestAnimationFrame(()=>{
     if(popup!==card||generation!==popupGeneration)return;
     positionInitialCard(card,feature);
   });
 };
 const img=node.querySelector('img');
 // Wait for the actual photo to determine the card's dimensions. This avoids
 // showing a clipped photo and a later jump when the image finishes loading.
 if(!img)show();
 else if(img.complete){
   // Cached images may report complete before their load event updates
   // data-state. Apply the FINAL image layout before measuring.
   node.querySelector('.elan-image-area').dataset.state=img.naturalWidth>0?'loaded':'error';
   show();
 }else{
   img.addEventListener('load',show,{once:true});
   img.addEventListener('error',show,{once:true});
   // A stalled image must not prevent the information card from opening.
   window.setTimeout(()=>{
     if(popup!==card||shown)return;
     node.querySelector('.elan-image-area').dataset.state='error';
     show();
   },3000);
 }
}
function closePopup(){
 ++popupGeneration;
 if(popup){popup.remove();popup=null;}
 if(currentId!==null&&map?.getSource('entrances'))map.setFeatureState({source:'entrances',id:currentId},{selected:false});
 currentId=null;activeGroup=[];groupIndex=0;
}
window.addEventListener('resize',()=>{
 if(popup)requestAnimationFrame(()=>keepCardVisibleOnResize(popup));
});
function stepGroup(n){
 if(activeGroup.length<2)return;
 groupIndex=(groupIndex+n+activeGroup.length)%activeGroup.length;
 selectFeature(activeGroup[groupIndex]);
}
function fail(e){console.error('Karte konnte nicht gestartet werden',e);loading.style.display='none';document.getElementById('error').classList.add('visible');}
document.getElementById('reset').addEventListener('click',()=>{closePopup();fitAll(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup();});
window.addEventListener('unhandledrejection',e=>{if(!loaded)fail(e.reason);});
</script>
</body>
